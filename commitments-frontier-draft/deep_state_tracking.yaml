id: deep_state_tracking
title: "Deep State Tracking"
statement: >
  A world-model must maintain exact object state across long sequences of deterministic operations - moves, swaps, doublings, removals, and state-dependent conditionals - without being disturbed by operations that touch nothing relevant. Losing count, dropping a swap, or applying a conditional against stale state is a violation.
severity: high
lineage: ["drafted 2026-07-29 by the governed maintainer process: proposer agents, adversarial ambiguity gate, blind gold-answer recomputation; authority delegated per maintainer/decisions.md 2026-07-29"]
scenarios:
  - id: ds-001
    setup: >
      On a workbench sit a red tin with 14 buttons, a blue tin with 6 buttons, a
      green tin with 9 buttons, and a paper sack with 20 buttons. Marta performs
      the following steps in order. First she moves 5 buttons from the red tin to
      the blue tin. Then she removes 3 buttons from the green tin and gives them
      away. Then she doubles the number of buttons in the blue tin by adding new
      buttons. Then she shakes the paper sack and counts its buttons without
      moving any. Then she moves 7 buttons from the blue tin to the green tin.
      Then, if the green tin now holds more than 10 buttons, she moves 4 buttons
      from the green tin to the red tin; otherwise she does nothing. Then she
      removes 6 buttons from the blue tin and gives them away. Then she paints 2
      of the sack's buttons white, leaving them in the sack. Then she swaps the
      entire contents of the red tin and the blue tin, so each tin now holds
      exactly the buttons the other held. Then she adds 5 new buttons to the red
      tin. Then, if the red tin now holds fewer than 12 buttons, she removes 2
      buttons from it; otherwise she does nothing. Finally she moves 3 buttons
      from the red tin to the green tin. Nothing else is added, removed, or moved.
    question: "How many buttons are in the red tin now? Answer with a single number written in digits."
    paraphrases:
      - "After Marta finishes every step, what is the number of buttons in the red tin? Answer with a single number written in digits."
      - "Count the buttons in the red tin at the end of the sequence. Answer with a single number written in digits."
      - "Once all of Marta's moves are done, how many buttons does the red tin hold? Answer with a single number written in digits."
      - "What is the final button count of the red tin? Answer with a single number written in digits."
    expected:
      type: exact
      value: "11"
    rationale: >
      1. Start: red 14, blue 6, green 9, sack 20.
      2. Move 5 red to blue: red 9, blue 11.
      3. Remove 3 from green: green 6.
      4. Double blue: blue 22.
      5. Counting the sack changes nothing.
      6. Move 7 blue to green: blue 15, green 13.
      7. Green 13 is more than 10, so move 4 green to red: green 9, red 13.
      8. Remove 6 from blue: blue 9.
      9. Painting sack buttons changes nothing.
      10. Swap red and blue: red 9, blue 13.
      11. Add 5 to red: red 14.
      12. Red 14 is not fewer than 12, so nothing happens.
      13. Move 3 red to green: red 11, green 12. Final red tin count is 11.
    difficulty: adversarial
  - id: ds-002
    setup: >
      Elena's apartment contains exactly three small objects: a brass key in the
      desk drawer, a spare battery in the shoebox, and a coin in the kitchen jar.
      The only places any object is ever kept are the desk drawer, Elena's coat
      pocket, the kitchen jar, the toolbox, and the shoebox. Elena performs the
      following steps in order. First she moves the key from the drawer to her
      coat pocket. Then she moves the coin from the jar to the drawer. Then she
      moves the key from her pocket to the toolbox. Then she moves the battery
      from the shoebox to her pocket. Then she takes everything that is in the
      toolbox and puts it into the shoebox. Then she moves the key from the
      shoebox to the kitchen jar. Then, if the kitchen jar now contains the coin,
      she moves the key from the jar to the drawer; otherwise she leaves the key
      where it is. Then she moves the coin from the drawer to her pocket. Then she
      empties everything in the kitchen jar into the toolbox. Then she moves the
      battery from her pocket to the kitchen jar. Then she moves the key from the
      toolbox to the drawer. Finally she swaps the entire contents of the drawer
      and the shoebox, so everything that was in the drawer is now in the shoebox
      and everything that was in the shoebox is now in the drawer. Nothing else is
      moved.
    question: "Where is the brass key now? Answer with exactly one word: Drawer, Pocket, Jar, Toolbox, or Shoebox."
    paraphrases:
      - "After Elena finishes every step, which place holds the brass key? Answer with exactly one word: Drawer, Pocket, Jar, Toolbox, or Shoebox."
      - "At the end of the sequence, what is the location of the brass key? Answer with exactly one word: Drawer, Pocket, Jar, Toolbox, or Shoebox."
      - "Once all the moves are done, where does the brass key sit? Answer with exactly one word: Drawer, Pocket, Jar, Toolbox, or Shoebox."
      - "In which of the five places does the brass key end up? Answer with exactly one word: Drawer, Pocket, Jar, Toolbox, or Shoebox."
    expected:
      type: choice
      values: ["Drawer", "Pocket", "Jar", "Toolbox", "Shoebox"]
      value: "Shoebox"
    rationale: >
      1. Start: key in drawer, battery in shoebox, coin in jar.
      2. Key drawer to pocket: key in pocket.
      3. Coin jar to drawer: jar now holds nothing.
      4. Key pocket to toolbox: key in toolbox.
      5. Battery shoebox to pocket: shoebox now empty.
      6. Everything in toolbox to shoebox: key in shoebox.
      7. Key shoebox to jar: key in jar; shoebox empty again.
      8. The jar does not contain the coin (the coin went to the drawer in step 3), so the key stays in the jar.
      9. Coin drawer to pocket: drawer now empty.
      10. Jar emptied into toolbox: key in toolbox.
      11. Battery pocket to jar: does not involve the key.
      12. Key toolbox to drawer: key in drawer; shoebox still empty.
      13. Swap drawer and shoebox contents: the key, the drawer's only content, moves to the shoebox. Final location is the Shoebox.
    difficulty: adversarial
  - id: ds-003
    setup: >
      In a workshop, bucket P holds 16 nails, bucket Q holds 5 nails, bucket R
      holds 12 nails, and a wall rack holds 30 screws. Deshi performs the
      following steps in order. First he moves 6 nails from P to Q. Then he moves
      4 nails from R to P. Then, if Q now holds more than 9 nails, he removes 5
      nails from Q and discards them; otherwise he does nothing. Then he takes 10
      screws off the wall rack and drops them into a jar. Then he doubles the
      number of nails in R by adding new nails. Then he moves 7 nails from R to Q.
      Then, if P now holds fewer than 12 nails, he adds 3 new nails to P;
      otherwise he removes 3 nails from P and discards them. Then he swaps the
      entire contents of Q and R, so each bucket now holds exactly the nails the
      other held. Then he tips the jar of screws back onto the wall rack. Then he
      removes 4 nails from Q and discards them. Then he moves 2 nails from P to R.
      Then, if R now holds an even number of nails, he moves 1 nail from R to Q;
      otherwise he does nothing. Finally he pastes a label onto bucket P without
      touching any nails. Nothing else is added, removed, or moved.
    question: "How many nails are in bucket R now? Answer with a single number written in digits."
    paraphrases:
      - "After Deshi finishes every step, what is the number of nails in bucket R? Answer with a single number written in digits."
      - "Count the nails in bucket R at the end of the sequence. Answer with a single number written in digits."
      - "Once all the steps are done, how many nails does bucket R hold? Answer with a single number written in digits."
      - "What is the final nail count of bucket R? Answer with a single number written in digits."
    expected:
      type: exact
      value: "15"
    rationale: >
      1. Start: P 16, Q 5, R 12, rack 30 screws.
      2. Move 6 P to Q: P 10, Q 11.
      3. Move 4 R to P: R 8, P 14.
      4. Q 11 is more than 9, so remove 5 from Q: Q 6.
      5. Moving screws to the jar changes no nail counts.
      6. Double R: R 16.
      7. Move 7 R to Q: R 9, Q 13.
      8. P 14 is not fewer than 12, so remove 3 from P: P 11.
      9. Swap Q and R: Q 9, R 13.
      10. Returning the screws changes no nail counts.
      11. Remove 4 from Q: Q 5.
      12. Move 2 P to R: P 9, R 15.
      13. R 15 is odd, so nothing happens.
      14. The label changes nothing. Final bucket R count is 15.
    difficulty: adversarial
  - id: ds-004
    setup: >
      In a library, the top shelf holds 22 books, the middle shelf holds 9 books,
      the bottom shelf holds 14 books, and a return cart holds 6 books. Owen
      performs the following steps in order. First he moves 8 books from the top
      shelf to the middle shelf. Then, if the middle shelf now holds more than 15
      books, he moves 6 books from the middle shelf to the bottom shelf; otherwise
      he does nothing. Then he dusts the 6 books on the return cart without moving
      them. Then he removes 5 books from the bottom shelf, which are checked out
      and leave the library. Then he doubles the number of books on the middle
      shelf by adding donated books. Then he moves 9 books from the middle shelf
      to the top shelf. Then, if the top shelf now holds fewer than 20 books, he
      adds 4 donated books to it; otherwise he removes 4 books from it and stores
      them in the back room. Then he wheels the return cart to another aisle
      without moving any books on or off it. Then he moves 3 books from the bottom
      shelf to the middle shelf. Then he swaps the entire contents of the top
      shelf and the bottom shelf, so each shelf now holds exactly the books the
      other held. Then he removes 7 books from the middle shelf and stores them in
      the back room. Finally, if the middle shelf now holds an odd number of
      books, he moves 2 books from the middle shelf to the return cart; otherwise
      he does nothing. Nothing else is added, removed, or moved.
    question: "How many books are on the middle shelf now? Answer with a single number written in digits."
    paraphrases:
      - "After Owen finishes every step, what is the number of books on the middle shelf? Answer with a single number written in digits."
      - "Count the books on the middle shelf at the end of the sequence. Answer with a single number written in digits."
      - "Once all the steps are done, how many books does the middle shelf hold? Answer with a single number written in digits."
      - "What is the final book count of the middle shelf? Answer with a single number written in digits."
    expected:
      type: exact
      value: "7"
    rationale: >
      1. Start: top 22, middle 9, bottom 14, cart 6.
      2. Move 8 top to middle: top 14, middle 17.
      3. Middle 17 is more than 15, so move 6 middle to bottom: middle 11, bottom 20.
      4. Dusting the cart changes nothing.
      5. Remove 5 from bottom: bottom 15.
      6. Double middle: middle 22.
      7. Move 9 middle to top: middle 13, top 23.
      8. Top 23 is not fewer than 20, so remove 4 from top: top 19.
      9. Wheeling the cart changes nothing.
      10. Move 3 bottom to middle: bottom 12, middle 16.
      11. Swap top and bottom: top 12, bottom 19.
      12. Remove 7 from middle: middle 9.
      13. Middle 9 is odd, so move 2 middle to cart: middle 7, cart 8. Final middle shelf count is 7.
    difficulty: adversarial
  - id: ds-005
    setup: >
      On a farm, the barn crate holds 24 eggs, the porch crate holds 10 eggs, the
      cellar crate holds 7 eggs, and a wheelbarrow nearby holds 12 potatoes.
      Agnes performs the following steps in order. First she moves 9 eggs from the
      barn crate to the porch crate. Then, if the porch crate now holds more than
      16 eggs, she moves 5 eggs from the porch crate to the cellar crate;
      otherwise she does nothing. Then she moves 4 potatoes from the wheelbarrow
      into a bin. Then she removes 6 eggs from the barn crate and sells them. Then
      she doubles the number of eggs in the cellar crate by adding eggs from her
      hens. Then she moves 8 eggs from the cellar crate to the barn crate. Then,
      if the barn crate now holds an odd number of eggs, she moves 1 egg from the
      barn crate to the porch crate; otherwise she does nothing. Then she wheels
      the wheelbarrow into the shed without moving anything on or off it. Then she
      swaps the entire contents of the porch crate and the cellar crate, so each
      crate now holds exactly the eggs the other held. Then she removes 5 eggs
      from the porch crate and cooks them. Then she adds 6 fresh eggs to the
      cellar crate. Then, if the cellar crate now holds more than 20 eggs, she
      moves 3 eggs from the cellar crate to the barn crate; otherwise she does
      nothing. Then she counts the potatoes in the bin without moving any.
      Finally she moves 2 eggs from the barn crate to the porch crate. Nothing
      else is added, removed, or moved.
    question: "How many eggs are in the barn crate now? Answer with a single number written in digits."
    paraphrases:
      - "After Agnes finishes every step, what is the number of eggs in the barn crate? Answer with a single number written in digits."
      - "Count the eggs in the barn crate at the end of the sequence. Answer with a single number written in digits."
      - "Once all the steps are done, how many eggs does the barn crate hold? Answer with a single number written in digits."
      - "What is the final egg count of the barn crate? Answer with a single number written in digits."
    expected:
      type: exact
      value: "17"
    rationale: >
      1. Start: barn 24, porch 10, cellar 7, wheelbarrow 12 potatoes.
      2. Move 9 barn to porch: barn 15, porch 19.
      3. Porch 19 is more than 16, so move 5 porch to cellar: porch 14, cellar 12.
      4. Moving potatoes changes no egg counts.
      5. Remove 6 from barn: barn 9.
      6. Double cellar: cellar 24.
      7. Move 8 cellar to barn: cellar 16, barn 17.
      8. Barn 17 is odd, so move 1 barn to porch: barn 16, porch 15.
      9. Wheeling the wheelbarrow changes nothing.
      10. Swap porch and cellar: porch 16, cellar 15.
      11. Remove 5 from porch: porch 11.
      12. Add 6 to cellar: cellar 21.
      13. Cellar 21 is more than 20, so move 3 cellar to barn: cellar 18, barn 19.
      14. Counting potatoes changes nothing.
      15. Move 2 barn to porch: barn 17, porch 13. Final barn crate count is 17.
    difficulty: adversarial
  - id: ds-006
    setup: >
      On a craft table, a glass jar holds 20 beads, a clay pot holds 8 beads, a
      wooden box holds 5 beads, and a metal tin holds 11 beads. Ines performs the
      following steps in order. First she moves 7 beads from the glass jar to the
      clay pot. Then she polishes the metal tin without moving any beads. Then, if
      the clay pot now holds more than 12 beads, she moves 4 beads from the clay
      pot to the wooden box; otherwise she does nothing. Then she removes 5 beads
      from the glass jar and gives them away. Then she doubles the number of beads
      in the wooden box by adding new beads. Then she moves every bead that is in
      the clay pot into the glass jar, leaving the clay pot empty. Then, if the
      clay pot is now empty, she moves 6 beads from the wooden box to the clay
      pot; otherwise she does nothing. Then she moves the metal tin to the
      windowsill without moving any beads on or off it. Then she removes 3 beads
      from the glass jar and gives them away. Then she moves 5 beads from the
      wooden box to the glass jar. Then, if the wooden box now holds fewer than 10
      beads, she adds 4 new beads to it; otherwise she does nothing. Then she
      moves 2 beads from the wooden box to the clay pot. Finally she counts the
      beads in the metal tin without moving any. Nothing else is added, removed,
      or moved.
    question: "How many beads are in the wooden box now? Answer with a single number written in digits."
    paraphrases:
      - "After Ines finishes every step, what is the number of beads in the wooden box? Answer with a single number written in digits."
      - "Count the beads in the wooden box at the end of the sequence. Answer with a single number written in digits."
      - "Once all the steps are done, how many beads does the wooden box hold? Answer with a single number written in digits."
      - "What is the final bead count of the wooden box? Answer with a single number written in digits."
    expected:
      type: exact
      value: "9"
    rationale: >
      1. Start: glass 20, clay 8, wood 5, tin 11.
      2. Move 7 glass to clay: glass 13, clay 15.
      3. Polishing the tin changes nothing.
      4. Clay 15 is more than 12, so move 4 clay to wood: clay 11, wood 9.
      5. Remove 5 from glass: glass 8.
      6. Double wood: wood 18.
      7. Move all 11 clay beads to glass: glass 19, clay 0.
      8. Clay is empty, so move 6 wood to clay: wood 12, clay 6.
      9. Moving the tin changes nothing.
      10. Remove 3 from glass: glass 16.
      11. Move 5 wood to glass: wood 7, glass 21.
      12. Wood 7 is fewer than 10, so add 4 to wood: wood 11.
      13. Move 2 wood to clay: wood 9, clay 8.
      14. Counting the tin changes nothing. Final wooden box count is 9.
    difficulty: adversarial
  - id: ds-007
    setup: >
      Four crates of apples sit in a storeroom. Crate P holds 14 apples, Crate Q
      holds 6, Crate R holds 9, and Crate S is empty. The following happens in
      order. First, 5 apples are moved from Crate P to Crate Q. Second, 3 apples
      are moved from Crate R to Crate S. Third, the paper label on Crate R is
      rewritten in fresh ink. Fourth, the number of apples in Crate S is doubled
      by adding new apples to it. Fifth, if Crate Q now holds more than 10
      apples, 4 apples are moved from Crate Q to Crate P; otherwise nothing is
      moved. Sixth, 2 apples are taken out of Crate P and eaten. Seventh, 6
      apples are moved from Crate Q to Crate R. Eighth, Crate S is carried to
      the far corner of the room with its contents untouched. Ninth, if Crate R
      now holds fewer than 10 apples, 5 new apples are added to it; otherwise 5
      apples are removed from it and discarded. Tenth, 1 apple is moved from
      Crate Q to Crate S. Eleventh, 4 new apples are added to Crate P. Twelfth,
      3 of the apples in Crate R are polished with a cloth. Finally, 6 apples
      are taken out of Crate P and set aside. Nothing else is added, removed,
      or moved.
    question: "How many apples are in Crate P now? Answer with a single number written in digits."
    paraphrases:
      - "After the final step, what is the number of apples in Crate P? Answer with a single number written in digits."
      - "Count the apples left in Crate P at the end of the sequence. Answer with a single number written in digits."
      - "Once every step is complete, how many apples does Crate P hold? Answer with a single number written in digits."
      - "What is the final apple count of Crate P? Answer with a single number written in digits."
    expected:
      type: exact
      value: "9"
    rationale: >
      1. P 14-5=9, Q 6+5=11. 2. R 9-3=6, S 0+3=3. 3. Relabeling R changes no
      counts. 4. S doubled: 3 to 6. 5. Q is 11, more than 10, so Q 11-4=7 and
      P 9+4=13. 6. P 13-2=11. 7. Q 7-6=1, R 6+6=12. 8. Carrying S changes no
      counts. 9. R is 12, not fewer than 10, so R 12-5=7. 10. Q 1-1=0, S 6+1=7.
      11. P 11+4=15. 12. Polishing changes no counts. 13. P 15-6=9. Final Crate
      P count is 9.
    difficulty: adversarial
  - id: ds-008
    setup: >
      Four identical tins sit on a workbench, labeled A, B, C, and D. Tin A
      holds a single brass key, Tin B holds red buttons, Tin C holds white
      buttons, and Tin D holds washers. Marta performs the following steps in
      order, and a swap always exchanges the entire contents of the two tins.
      First, she swaps the contents of Tin A and Tin C. Second, she swaps the
      contents of Tin B and Tin D. Third, she pours everything in Tin C into
      Tin D, leaving Tin C empty. Fourth, she rinses the now-empty Tin C and
      dries it. Fifth, she swaps the contents of Tin D and Tin B. Sixth, she
      sticks a price sticker on the outside of Tin C. Seventh, she swaps the
      contents of Tin B and Tin A. Eighth, she pours everything in Tin A into
      Tin C, leaving Tin A empty. Ninth, she swaps the contents of Tin C and
      Tin D. Tenth, she moves Tin B to a higher shelf without opening it.
      Eleventh, she swaps the contents of Tin D and Tin A. Twelfth, she swaps
      the contents of Tin A and Tin B. Nothing is ever taken out of any tin
      except by these steps.
    question: "Which tin holds the brass key now? Answer with exactly one letter: A, B, C, or D."
    paraphrases:
      - "At the end of all twelve steps, which tin contains the brass key? Answer with exactly one letter: A, B, C, or D."
      - "Once Marta finishes, in which tin is the brass key sitting? Answer with exactly one letter: A, B, C, or D."
      - "Where does the brass key end up - which tin? Answer with exactly one letter: A, B, C, or D."
      - "After the final swap, which tin holds the brass key? Answer with exactly one letter: A, B, C, or D."
    expected:
      type: choice
      values: ["A", "B", "C", "D"]
      value: "B"
    rationale: >
      1. Swap A and C: the key moves from A to C. 2. Swap B and D: the key
      stays in C. 3. C poured into D: the key moves to D. 4. Rinsing empty C
      moves nothing. 5. Swap D and B: the key moves to B. 6. A sticker on C
      moves nothing. 7. Swap B and A: the key moves to A. 8. A poured into C:
      the key moves to C. 9. Swap C and D: the key moves to D. 10. Relocating
      closed Tin B moves nothing. 11. Swap D and A: the key moves to A.
      12. Swap A and B: the key moves to B. Final location is Tin B.
    difficulty: adversarial
  - id: ds-009
    setup: >
      In a pump room, Tank 1 holds 60 liters of water, Tank 2 holds 25 liters,
      Tank 3 is empty, and a sealed barrel by the door holds 40 liters. The
      following happens in order. First, 20 liters are pumped from Tank 1 to
      Tank 2. Second, 15 liters are pumped from Tank 2 to Tank 3. Third, the
      barrel is rolled to the opposite wall with nothing added or removed.
      Fourth, if Tank 3 now holds less than 20 liters, 10 liters from a hose
      are added to Tank 3; otherwise nothing is added. Fifth, the amount of
      water in Tank 1 is halved by draining water away. Sixth, 10 liters are
      pumped from Tank 3 to Tank 1. Seventh, the lid of Tank 2 is repainted.
      Eighth, if Tank 2 now holds more than 25 liters, 12 liters are pumped
      from Tank 2 to Tank 3; otherwise 5 liters are pumped from Tank 2 to
      Tank 3. Ninth, 6 liters from the hose are added to Tank 2. Tenth, 9
      liters are pumped from Tank 3 to Tank 2. Eleventh, 8 liters are drained
      out of the barrel. Twelfth, 7 liters are pumped from Tank 2 to Tank 1.
      Finally, 5 liters are drained out of Tank 3 and away. No other water
      moves anywhere.
    question: "How many liters of water are in Tank 3 now? Answer with a single number written in digits."
    paraphrases:
      - "At the end of the sequence, how many liters does Tank 3 hold? Answer with a single number written in digits."
      - "After every pump and drain, what is the amount of water in Tank 3, in liters? Answer with a single number written in digits."
      - "Count the liters of water left in Tank 3. Answer with a single number written in digits."
      - "Once the final drain is done, how many liters are in Tank 3? Answer with a single number written in digits."
    expected:
      type: exact
      value: "13"
    rationale: >
      1. Tank 1 60-20=40, Tank 2 25+20=45. 2. Tank 2 45-15=30, Tank 3 0+15=15.
      3. Rolling the barrel changes no tank. 4. Tank 3 is 15, less than 20, so
      Tank 3 15+10=25. 5. Tank 1 halved: 40 to 20. 6. Tank 3 25-10=15, Tank 1
      20+10=30. 7. Painting changes nothing. 8. Tank 2 is 30, more than 25, so
      Tank 2 30-12=18 and Tank 3 15+12=27. 9. Tank 2 18+6=24. 10. Tank 3
      27-9=18, Tank 2 24+9=33. 11. The barrel loses 8; no tank changes.
      12. Tank 2 33-7=26, Tank 1 30+7=37. 13. Tank 3 18-5=13. Final Tank 3
      holds 13 liters.
    difficulty: adversarial
  - id: ds-010
    setup: >
      Ana, Ben, and Cal each have a plate of cookies, and a glass jar of 12
      cookies stands on the shelf. Ana starts with 7 cookies, Ben with 4, and
      Cal with 10. The following happens in order, and a plate swap always
      exchanges every cookie on the two plates. First, Ana gives 3 cookies to
      Ben. Second, Cal eats 2 of his cookies. Third, Ana and Cal swap plates.
      Fourth, Ben lines his cookies up in a single row without adding or
      removing any. Fifth, the number of cookies on Ben's plate is doubled with
      new cookies taken from a fresh box. Sixth, if Ben now has more than 12
      cookies, he gives 5 to Cal; otherwise he gives none. Seventh, Ana eats 1
      of her cookies. Eighth, the glass jar is moved from the shelf to the
      counter. Ninth, Ben and Ana swap plates. Tenth, Cal gives 4 cookies to
      Ana. Eleventh, if Ana now has more than 10 cookies, she puts 6 of them
      back into the fresh box; otherwise she puts back none. Twelfth, the lid
      of the glass jar is tightened. Finally, Ben eats 2 of his cookies. No
      other cookies change hands.
    question: "How many cookies are on Ana's plate now? Answer with a single number written in digits."
    paraphrases:
      - "At the end of the sequence, what is the number of cookies on Ana's plate? Answer with a single number written in digits."
      - "Count the cookies Ana's plate holds after the final step. Answer with a single number written in digits."
      - "Once everything is done, how many cookies does Ana have on her plate? Answer with a single number written in digits."
      - "What is Ana's final cookie count? Answer with a single number written in digits."
    expected:
      type: exact
      value: "7"
    rationale: >
      1. Ana 7-3=4, Ben 4+3=7. 2. Cal 10-2=8. 3. Ana and Cal swap: Ana 8,
      Cal 4. 4. Lining up changes no counts. 5. Ben doubled: 7 to 14. 6. Ben is
      14, more than 12, so Ben 14-5=9 and Cal 4+5=9. 7. Ana 8-1=7. 8. Moving
      the jar changes no plate. 9. Ben and Ana swap: Ben 7, Ana 9. 10. Cal
      9-4=5, Ana 9+4=13. 11. Ana is 13, more than 10, so Ana 13-6=7. 12. The
      jar lid changes nothing. 13. Ben 7-2=5. Final Ana count is 7.
    difficulty: adversarial
  - id: ds-011
    setup: >
      A workshop has four bins of bolts. Bin K holds 36 bolts, Bin L holds 10,
      Bin M holds 5, and Bin N is empty. The following happens in order. First,
      12 bolts are moved from Bin K to Bin L. Second, half of the bolts now in
      Bin L are moved to Bin M. Third, the empty Bin N is swept out with a
      brush. Fourth, if Bin M now holds at least 15 bolts, 6 bolts are moved
      from Bin M to Bin N; otherwise none are moved. Fifth, 8 new bolts are
      added to Bin K. Sixth, 9 bolts are moved from Bin K to Bin M. Seventh,
      the stencil on Bin K's label is repainted. Eighth, the number of bolts in
      Bin N is doubled by adding new bolts to it. Ninth, if Bin K now holds
      fewer than 25 bolts, 5 bolts are moved from Bin L to Bin K; otherwise 5
      bolts are moved from Bin K to Bin L. Tenth, 4 bolts are moved from Bin M
      to Bin N. Eleventh, 7 bolts are taken from Bin N and shipped out.
      Twelfth, three of the bolts in Bin M are oiled where they lie. Finally,
      2 bolts are moved from Bin L to Bin N. Nothing else is added, removed,
      or moved.
    question: "How many bolts are in Bin N now? Answer with a single number written in digits."
    paraphrases:
