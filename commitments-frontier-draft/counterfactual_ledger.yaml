id: counterfactual_ledger
title: "Counterfactual Ledger"
statement: >
  A world-model must hold two fully determined world-lines apart: the sequence as executed, and the same sequence under a precisely specified edit to a numbered step. Downstream conditionals must be recomputed in the edited world, and no state may bleed between the two lines.
severity: high
lineage: ["drafted 2026-07-29 by the governed maintainer process: proposer agents, adversarial ambiguity gate, blind gold-answer recomputation; authority delegated per maintainer/decisions.md 2026-07-29"]
scenarios:
  - id: cf-001
    setup: >
      A jar on Tomas's desk holds 50 coins, and a box beside it holds 20 coins.
      Tomas then carried out the following ten steps in order. Step 1: he moved
      16 coins from the jar into the box. Step 2: he dropped 10 new coins into
      the jar. Step 3: he moved 10 coins from the box into the jar. Step 4: he
      removed exactly half of the coins then in the jar and spent them. Step 5:
      he dropped 5 new coins into the box. Step 6: he moved 8 coins from the jar
      into the box. Step 7: he doubled the number of coins then in the box by
      adding new coins to it. Step 8: he removed 12 coins from the box and spent
      them. Step 9: he moved 20 coins from the box into the jar. Step 10: he
      removed 4 coins from the jar and spent them. No other coins were ever
      added or removed.
    question: "If step 2 had never happened, and every other step had been carried out exactly as described and in the same order, how many coins would the jar hold at the end? Answer with a single number written in digits."
    paraphrases:
      - "Suppose step 2 is deleted from the sequence while steps 1 and 3 through 10 run unchanged and in order. How many coins would end up in the jar? Answer with a single number written in digits."
      - "In a version of events where Tomas skips step 2 but performs all the other steps exactly as stated, what would the jar's final coin count be? Answer with a single number written in digits."
      - "Had the 10 new coins of step 2 never been dropped in, with the rest of the ten steps done as described, how many coins would the jar contain at the end? Answer with a single number written in digits."
      - "Remove step 2 from the sequence and replay the remaining steps in order. What is the final number of coins in the jar? Answer with a single number written in digits."
    expected:
      type: exact
      value: "30"
    rationale: >
      Edited world with step 2 deleted: 1. Start: jar 50, box 20. 2. Step 1
      moves 16 jar-to-box: jar 34, box 36. 3. Step 2 is skipped: jar 34. 4.
      Step 3 moves 10 box-to-jar: jar 44, box 26. 5. Step 4 halves the jar's 44:
      jar 22. 6. Step 5 adds 5 to the box: box 31. 7. Step 6 moves 8 jar-to-box:
      jar 14, box 39. 8. Step 7 doubles the box's 39: box 78. 9. Step 8 removes
      12 from the box: box 66. 10. Step 9 moves 20 box-to-jar: jar 34, box 46.
      11. Step 10 removes 4 from the jar: jar 30. The actual world ends at 35;
      the halving at step 4 turns the missing 10 coins into a missing 5.
    difficulty: adversarial
  - id: cf-002
    setup: >
      A vat in Ines's cellar holds 120 liters of water, and a barrel beside it
      holds 40 liters. Ines then carried out the following ten steps in order.
      Step 1: she poured 30 liters from the vat into the barrel. Step 2: she
      drained 20 liters out of the vat and threw the water away. Step 3: she
      added 10 liters of fresh water to the barrel. Step 4: she drained exactly
      half of the water then in the vat and threw it away. Step 5: she poured 15
      liters from the barrel into the vat. Step 6: she added 6 liters of fresh
      water to the vat. Step 7: she doubled the amount of water then in the
      barrel by adding fresh water. Step 8: she poured 25 liters from the barrel
      into the vat. Step 9: she drained 11 liters out of the vat. Step 10: she
      added 5 liters of fresh water to the barrel. No other water ever entered
      or left either container.
    question: "If the operations of step 2 and step 6 had been swapped in order - the 6 liters added to the vat in step 2's place, and the 20 liters drained from the vat in step 6's place, with all other steps unchanged - how many liters of water would the vat hold at the end? Answer with a single number written in digits."
    paraphrases:
      - "Suppose Ines had done step 6's addition of 6 liters second in the sequence and step 2's draining of 20 liters sixth, leaving every other step exactly as described. What would the vat's final volume in liters be? Answer with a single number written in digits."
      - "Exchange the positions of step 2 and step 6 - the fresh 6 liters go in where the drain of 20 was, and the drain of 20 happens where the 6 liters went in - and replay the whole sequence. How many liters would the vat then hold at the end? Answer with a single number written in digits."
      - "In a version of events where steps 2 and 6 trade places in the order while steps 1, 3, 4, 5, 7, 8, 9, and 10 stay put, what is the final number of liters in the vat? Answer with a single number written in digits."
      - "Had the drain of 20 liters and the addition of 6 liters swapped their positions in the sequence, with everything else unchanged, how many liters would end up in the vat? Answer with a single number written in digits."
    expected:
      type: exact
      value: "57"
    rationale: >
      Edited world with steps 2 and 6 swapped: 1. Start: vat 120, barrel 40. 2.
      Step 1 pours 30 vat-to-barrel: vat 90, barrel 70. 3. Swapped step 2 adds 6
      to the vat: vat 96. 4. Step 3 adds 10 to the barrel: barrel 80. 5. Step 4
      halves the vat's 96: vat 48. 6. Step 5 pours 15 barrel-to-vat: vat 63,
      barrel 65. 7. Swapped step 6 drains 20 from the vat: vat 43. 8. Step 7
      doubles the barrel's 65: barrel 130. 9. Step 8 pours 25 barrel-to-vat: vat
      68, barrel 105. 10. Step 9 drains 11 from the vat: vat 57. 11. Step 10
      adds 5 to the barrel: barrel 110. The swap matters because the halving at
      step 4 sits between the two swapped operations: in the actual world the
      vat ends at 70, but with the addition before the halving and the drain
      after it, the vat ends at 57.
    difficulty: adversarial
  - id: cf-003
    setup: >
      A shelf in Owen's study holds 60 books, and a rolling cart beside it holds
      24 books. Owen then carried out the following ten steps in order. Step 1:
      he moved 20 books from the shelf onto the cart. Step 2: he removed 6 books
      from the cart and donated them. Step 3: he moved every book then on the
      cart onto the shelf, leaving the cart empty. Step 4: he removed 14 books
      from the shelf and gave them away. Step 5: he placed 9 newly bought books
      on the cart. Step 6: he moved 6 books from the cart onto the shelf. Step
      7: he took exactly half of the books then on the shelf, boxed them, and
      carried the box out of the room. Step 8: he placed 8 newly bought books on
      the shelf. Step 9: he moved 4 books from the shelf onto the cart. Step 10:
      he removed 2 books from the cart and donated them. No other books were
      ever added or removed.
    question: "If step 2 had never happened, and every other step had been carried out exactly as described and in the same order, would the shelf end with the same number of books as it actually did? Answer with exactly one word: Yes or No."
    paraphrases:
      - "Delete step 2 from the sequence and replay the remaining steps in order. Would the shelf's final book count match its actual final book count? Answer with exactly one word: Yes or No."
      - "In a version of events where Owen skips the donation in step 2 but performs all the other steps exactly as stated, does the shelf finish with the same number of books as it really finished with? Answer with exactly one word: Yes or No."
      - "Had the 6 books of step 2 never been donated, with the rest of the ten steps done as described, would the shelf's ending count equal the ending count it actually had? Answer with exactly one word: Yes or No."
      - "Compare two runs of the sequence, one as described and one with step 2 removed. Do the two runs leave the same number of books on the shelf? Answer with exactly one word: Yes or No."
    expected:
      type: choice
      values: ["Yes", "No"]
      value: "No"
    rationale: >
      Actual world: 1. Start: shelf 60, cart 24. 2. Step 1: shelf 40, cart 44.
      3. Step 2: cart 38. 4. Step 3 moves all 38: shelf 78, cart 0. 5. Step 4:
      shelf 64. 6. Step 5: cart 9. 7. Step 6: shelf 70, cart 3. 8. Step 7 halves
      70: shelf 35. 9. Step 8: shelf 43. 10. Step 9: shelf 39, cart 7. 11. Step
      10: cart 5. Actual shelf: 39. Edited world with step 2 deleted: 1. Step 1:
      shelf 40, cart 44. 2. Step 3 moves all 44: shelf 84, cart 0. 3. Step 4:
      shelf 70. 4. Step 5: cart 9. 5. Step 6: shelf 76, cart 3. 6. Step 7 halves
      76: shelf 38. 7. Step 8: shelf 46. 8. Step 9: shelf 42, cart 7. 9. Step
      10: cart 5. Edited shelf: 42. Because the move-everything at step 3
      carries the extra 6 onto the shelf and the halving at step 7 cuts that
      difference to 3, the counts are 42 versus 39, so the answer is No.
    difficulty: adversarial
  - id: cf-004
    setup: >
      A bowl on Lena's workbench holds 30 beads, and a tray beside it holds 12
      beads. Lena then carried out the following ten steps in order. Step 1: she
      dropped 8 new beads onto the tray. Step 2: she moved 5 beads from the bowl
      onto the tray. Step 3: she doubled the number of beads then on the tray by
      adding new beads to it. Step 4: she moved 10 beads from the tray into the
      bowl. Step 5: she removed 7 beads from the bowl and strung them onto a
      necklace. Step 6: she dropped 6 new beads onto the tray. Step 7: she
      tipped every bead then on the tray into a discard bin, leaving the tray
      empty. Step 8: she dropped 15 new beads onto the tray. Step 9: she moved 5
      beads from the tray into the bowl. Step 10: she removed 3 beads from the
      bowl and strung them onto the necklace. No other beads were ever added or
      removed.
    question: "If step 3 had never happened, and every other step had been carried out exactly as described and in the same order, would the bowl end with the same number of beads as it actually did? Answer with exactly one word: Yes or No."
    paraphrases:
      - "Delete step 3 from the sequence and replay the remaining steps in order. Would the bowl's final bead count match its actual final bead count? Answer with exactly one word: Yes or No."
      - "In a version of events where Lena skips the doubling in step 3 but performs all the other steps exactly as stated, does the bowl finish with the same number of beads as it really finished with? Answer with exactly one word: Yes or No."
      - "Had the tray never been doubled at step 3, with the rest of the ten steps done as described, would the bowl's ending count equal the ending count it actually had? Answer with exactly one word: Yes or No."
      - "Compare two runs of the sequence, one as described and one with step 3 removed. Do the two runs leave the same number of beads in the bowl? Answer with exactly one word: Yes or No."
    expected:
      type: choice
      values: ["Yes", "No"]
      value: "Yes"
    rationale: >
      Actual world: 1. Start: bowl 30, tray 12. 2. Step 1: tray 20. 3. Step 2:
      bowl 25, tray 25. 4. Step 3 doubles 25: tray 50. 5. Step 4: bowl 35, tray
      40. 6. Step 5: bowl 28. 7. Step 6: tray 46. 8. Step 7 empties the tray:
      tray 0. 9. Step 8: tray 15. 10. Step 9: bowl 33, tray 10. 11. Step 10:
      bowl 30. Actual bowl: 30. Edited world with step 3 deleted: 1. Step 1:
      tray 20. 2. Step 2: bowl 25, tray 25. 3. Step 4 moves a fixed 10: bowl 35,
      tray 15. 4. Step 5: bowl 28. 5. Step 6: tray 21. 6. Step 7 empties the
      tray: tray 0. 7. Step 8: tray 15. 8. Step 9: bowl 33. 9. Step 10: bowl 30.
      Edited bowl: 30. Every transfer into the bowl is a fixed amount and the
      tray is emptied at step 7 in both worlds, so deleting the doubling never
      reaches the bowl: 30 equals 30, and the answer is Yes.
    difficulty: adversarial
  - id: cf-005
    setup: >
      Ravi holds 40 game tokens and Sana holds 26 game tokens, and a bank of
      spare tokens sits between them. They then carried out the following ten
      steps in order. Step 1: Ravi handed 10 tokens to Sana. Step 2: Sana
      discarded 8 tokens into the bank. Step 3: Ravi took 6 tokens from the
      bank. Step 4: Sana handed 4 tokens to Ravi. Step 5: Sana paid exactly half
      of the tokens then in her hand into the bank. Step 6: Ravi discarded 9
      tokens into the bank. Step 7: Sana took 7 tokens from the bank. Step 8:
      Sana discarded 6 tokens into the bank. Step 9: Ravi handed 5 tokens to
      Sana. Step 10: Sana handed 11 tokens to Ravi. No other tokens ever changed
      hands.
    question: "If the operations of step 2 and step 8 had been swapped in order - Sana discarding 6 tokens in step 2's place and discarding 8 tokens in step 8's place, with all other steps unchanged - how many tokens would Sana hold at the end? Answer with a single number written in digits."
    paraphrases:
      - "Suppose Sana's discard of 6 came second in the sequence and her discard of 8 came eighth, with every other step exactly as described. How many tokens would Sana end with? Answer with a single number written in digits."
      - "Exchange the positions of step 2 and step 8 - the 6-token discard happens where the 8-token discard was, and the 8-token discard happens where the 6-token discard was - and replay the whole sequence. What would Sana's final token count be? Answer with a single number written in digits."
      - "In a version of events where steps 2 and 8 trade places in the order while steps 1, 3, 4, 5, 6, 7, 9, and 10 stay put, how many tokens does Sana hold at the end? Answer with a single number written in digits."
      - "Had the two discards in step 2 and step 8 swapped their positions in the sequence, with everything else unchanged, what number of tokens would Sana finish with? Answer with a single number written in digits."
    expected:
      type: exact
      value: "6"
    rationale: >
      Edited world with steps 2 and 8 swapped: 1. Start: Ravi 40, Sana 26. 2.
      Step 1: Ravi 30, Sana 36. 3. Swapped step 2, Sana discards 6: Sana 30. 4.
      Step 3: Ravi 36. 5. Step 4: Ravi 40, Sana 26. 6. Step 5 halves Sana's 26:
      Sana 13. 7. Step 6: Ravi 31. 8. Step 7: Sana 20. 9. Swapped step 8, Sana
      discards 8: Sana 12. 10. Step 9: Ravi 26, Sana 17. 11. Step 10: Ravi 37,
      Sana 6. The swap matters because the halving at step 5 sits between the
      two discards: in the actual world Sana ends with 7, but with the smaller
      discard before the halving she ends with 6.
    difficulty: adversarial
  - id: cf-006
    setup: >
      On Bram's farm, Crate P holds 28 apples and Crate Q holds 50 apples. Bram
      then carried out the following ten steps in order. Step 1: he moved 6
      apples from Crate P into Crate Q. Step 2: he added 10 freshly picked
      apples to Crate P. Step 3: he removed 12 apples from Crate Q and pressed
      them for juice. Step 4: he doubled the number of apples then in Crate P by
      adding freshly picked apples to it. Step 5: he moved 20 apples from Crate
      Q into Crate P. Step 6: he removed 15 apples from Crate P and sold them.
      Step 7: he added 8 freshly picked apples to Crate Q. Step 8: he moved 10
      apples from Crate P into Crate Q. Step 9: he removed 6 apples from Crate P
      and fed them to his goats. Step 10: he removed 9 apples from Crate Q and
      fed them to his goats. No other apples were ever added or removed.
    question: "If step 2 had never happened, and every other step had been carried out exactly as described and in the same order, would Crate P and Crate Q end with the same number of apples as each other? Answer with exactly one word: Yes or No."
    paraphrases:
      - "Delete step 2 from the sequence and replay the remaining steps in order. Would the two crates finish holding equal numbers of apples? Answer with exactly one word: Yes or No."
      - "In a version of events where Bram skips the 10 freshly picked apples of step 2 but performs all the other steps exactly as stated, do Crate P and Crate Q end up with matching apple counts? Answer with exactly one word: Yes or No."
      - "Had step 2 never occurred, with the rest of the ten steps done as described, would the final number of apples in Crate P equal the final number in Crate Q? Answer with exactly one word: Yes or No."
      - "Remove step 2 from the sequence and carry out the remaining steps in order. At the end, is Crate P's apple count the same as Crate Q's? Answer with exactly one word: Yes or No."
    expected:
      type: choice
      values: ["Yes", "No"]
      value: "Yes"
    rationale: >
      Edited world with step 2 deleted: 1. Start: P 28, Q 50. 2. Step 1 moves 6
      P-to-Q: P 22, Q 56. 3. Step 2 is skipped: P 22. 4. Step 3 removes 12 from
      Q: Q 44. 5. Step 4 doubles P's 22: P 44. 6. Step 5 moves 20 Q-to-P: P 64,
      Q 24. 7. Step 6 removes 15 from P: P 49. 8. Step 7 adds 8 to Q: Q 32. 9.
      Step 8 moves 10 P-to-Q: P 39, Q 42. 10. Step 9 removes 6 from P: P 33. 11.
      Step 10 removes 9 from Q: Q 33. Both crates end at 33, so the answer is
      Yes. In the actual world P ends at 53 and Q at 33, because the doubling at
      step 4 turns step 2's extra 10 into an extra 20 for P; only in the edited
      world are the crates equal.
    difficulty: adversarial
  - id: cf-007
    setup: >
      A tin holds 26 buttons and a tray beside it starts empty. Tomas performs
      the following nine steps in order. Step 1: he moves 8 buttons from the tin
      to the tray. Step 2: he adds 5 new buttons to the tin. Step 3: he doubles
      the number of buttons in the tin by adding new buttons. Step 4: he moves 6
      buttons from the tin to the tray. Step 5: he removes 10 buttons from the
      tray and gives them away. Step 6: he applies this rule: if the tin at that
      moment holds more than 34 buttons, he removes 12 buttons from the tin;
      otherwise he removes 4 buttons from the tin. Step 7: he moves 9 buttons
      from the tin to the tray. Step 8: he adds 7 new buttons to the tin.
      Step 9: he applies this rule: if the tray at that moment holds fewer than
      10 buttons, he moves 5 buttons from the tin to the tray; otherwise he
      moves 2 buttons from the tin to the tray. No other buttons are added,
      removed, or moved.
    question: "If step 2 had not happened and every other step had still been carried out in order, with each rule applied to the state at that moment, how many buttons would the tin hold at the end? Answer with a single number and nothing else."
    paraphrases:
      - "Suppose step 2 is deleted from the sequence and steps 1 and 3 through 9 run in order, each rule evaluated on the state at that moment. How many buttons would end up in the tin? Answer with a single number and nothing else."
      - "In the version of events where step 2 never occurs but all remaining steps proceed in order with their rules applied as stated, what is the final number of buttons in the tin? Answer with a single number and nothing else."
      - "Had Tomas skipped step 2 entirely while performing every other step in the same order, how many buttons would the tin contain at the end? Answer with a single number and nothing else."
      - "Remove step 2 from the sequence, keep steps 1 and 3 through 9 unchanged and in order, and apply each rule to the tin and tray as they then stand. How many buttons does the tin hold at the end of that edited sequence? Answer with a single number and nothing else."
    expected:
      type: exact
      value: "22"
    rationale: >
      Edited world with step 2 deleted. 1. Step 1: tin 26 - 8 = 18, tray 8.
      2. Step 2: skipped, tin stays 18. 3. Step 3: tin doubles to 36.
      4. Step 4: tin 36 - 6 = 30, tray 8 + 6 = 14. 5. Step 5: tray 14 - 10 = 4.
      6. Step 6: tin is 30, which is not more than 34, so remove 4: tin 26.
      7. Step 7: tin 26 - 9 = 17, tray 4 + 9 = 13. 8. Step 8: tin 17 + 7 = 24.
      9. Step 9: tray is 13, which is not fewer than 10, so move 2: tin 24 - 2 =
      22, tray 15. Final tin = 22. (In the actual world the tin reaches 40 at
      step 6, the rule removes 12 instead of 4, and the tin ends at 24, so 24
      is the state-bleed trap.)
    difficulty: adversarial
  - id: cf-008
    setup: >
      A cash box holds 40 dollars. Rosa performs the following nine steps in
      order. Step 1: she adds 24 dollars to the box. Step 2: she removes 10
      dollars from the box. Step 3: she removes exactly half of the money then
      in the box. Step 4: she adds 15 dollars. Step 5: she removes 7 dollars.
      Step 6: she removes 4 dollars. Step 7: she adds 18 dollars. Step 8: she
      removes 6 dollars. Step 9: she adds 5 dollars. No other money enters or
      leaves the box.
    question: "If the operations of step 3 and step 7 had been performed in swapped order - the 18-dollar addition performed third and the remove-half operation performed seventh, with every other step unchanged and in its original position - how many dollars would the box hold at the end? Answer with a single number and nothing else."
    paraphrases:
      - "Swap steps 3 and 7, so that adding 18 dollars happens in step 3's position and removing half of the money then in the box happens in step 7's position, leaving all other steps as they are. How many dollars would the box hold at the end of that edited sequence? Answer with a single number and nothing else."
      - "Suppose Rosa had done step 7's operation (adding 18 dollars) at the third position and step 3's operation (removing half of the money then in the box) at the seventh position, with the rest of the sequence unchanged. What would the final dollar amount in the box be? Answer with a single number and nothing else."
      - "In the edited sequence where the operations of step 3 and step 7 trade places and everything else stays put, how many dollars are in the box at the end? Answer with a single number and nothing else."
      - "Had the remove-half operation of step 3 and the add-18 operation of step 7 been exchanged in order, all other steps unchanged, what would the box hold in dollars at the end? Answer with a single number and nothing else."
    expected:
      type: exact
      value: "37"
    rationale: >
      Edited world with steps 3 and 7 swapped. 1. Step 1: 40 + 24 = 64.
      2. Step 2: 64 - 10 = 54. 3. Third position (add 18): 54 + 18 = 72.
      4. Step 4: 72 + 15 = 87. 5. Step 5: 87 - 7 = 80. 6. Step 6: 80 - 4 = 76.
      7. Seventh position (remove half): 76 / 2 = 38. 8. Step 8: 38 - 6 = 32.
      9. Step 9: 32 + 5 = 37. Final box = 37. (In the actual order the halving
      hits 54 giving 27, and the box ends at 48, so 48 is the state-bleed trap.)
    difficulty: adversarial
  - id: cf-009
    setup: >
      A barrel holds 60 liters of water and a drum beside it holds 20 liters.
      The following ten steps happen in order. Step 1: 15 liters are moved from
      the barrel to the drum. Step 2: 10 liters are added to the barrel from a
      hose. Step 3: 25 liters are drained from the barrel. Step 4: the amount of
      water in the drum is doubled by adding water. Step 5: 12 liters are moved
      from the drum to the barrel. Step 6: this rule is applied: if the barrel
      at that moment holds at least 40 liters, 20 liters are drained from the
      barrel; otherwise 5 liters are drained from the barrel. Step 7: 8 liters
      are added to the barrel. Step 8: 6 liters are moved from the barrel to the
      drum. Step 9: this rule is applied: if the drum at that moment holds more
      than 60 liters, 10 liters are moved from the drum to the barrel; otherwise
      2 liters are moved from the drum to the barrel. Step 10: 4 liters are
      drained from the barrel. No water moves except as stated.
    question: "If step 2 had not happened and every other step had still been carried out in order, with each rule applied to the state at that moment, how many liters would the barrel hold at the end? Answer with a single number and nothing else."
    paraphrases:
      - "Delete step 2 from the sequence and run steps 1 and 3 through 10 in order, evaluating each rule on the water levels at that moment. How many liters would the barrel then hold at the end? Answer with a single number and nothing else."
      - "In the version of events where the hose addition of step 2 never occurs but all other steps proceed in order with their rules applied as stated, what is the final number of liters in the barrel? Answer with a single number and nothing else."
      - "Had step 2 been skipped entirely while every other step ran unchanged and in order, how many liters of water would the barrel contain at the end? Answer with a single number and nothing else."
      - "Suppose the sequence is edited only by removing step 2, with the remaining steps performed in order and each rule judged against the levels at that time. How many liters end up in the barrel? Answer with a single number and nothing else."
    expected:
      type: exact
      value: "35"
    rationale: >
      Edited world with step 2 deleted. 1. Step 1: barrel 60 - 15 = 45, drum
      20 + 15 = 35. 2. Step 2: skipped, barrel stays 45. 3. Step 3: barrel
      45 - 25 = 20. 4. Step 4: drum doubles to 70. 5. Step 5: barrel 20 + 12 =
      32, drum 70 - 12 = 58. 6. Step 6: barrel is 32, which is not at least 40,
      so drain 5: barrel 27. 7. Step 7: barrel 27 + 8 = 35. 8. Step 8: barrel
      35 - 6 = 29, drum 58 + 6 = 64. 9. Step 9: drum is 64, which is more than
      60, so move 10: barrel 29 + 10 = 39, drum 54. 10. Step 10: barrel 39 - 4 =
      35. Final barrel = 35. (In the actual world the barrel is 42 at step 6,
      the rule drains 20, and the barrel ends at 30, so removing 10 liters of
      input raises the final level - the naive answer 20 and the actual answer
      30 are both traps.)
    difficulty: adversarial
  - id: cf-010
    setup: >
      Shelf A holds 40 books and Shelf B holds 16 books. Ines performs the
      following ten steps in order. Step 1: she moves 6 books from Shelf A to
      Shelf B. Step 2: she adds 8 new books to Shelf A. Step 3: she moves
      exactly half of the books then on Shelf B to Shelf A. Step 4: she removes
      9 books from Shelf A and donates them. Step 5: she moves 4 books from
      Shelf A to Shelf B. Step 6: she adds 5 new books to Shelf B. Step 7: she
      moves exactly half of the books then on Shelf A to Shelf B. Step 8: she
      removes 12 books from Shelf B and boxes them up. Step 9: she adds 6 new
      books to Shelf A. Step 10: she moves 10 books from Shelf B to Shelf A. No
      other books are added, removed, or moved.
    question: "If the operations of step 3 and step 7 had been performed in swapped order - moving half of Shelf A's books to Shelf B done third, and moving half of Shelf B's books to Shelf A done seventh, with every other step unchanged and in its original position - how many books would Shelf A hold at the end? Answer with a single number and nothing else."
    paraphrases:
      - "Swap steps 3 and 7, so that the half-of-A transfer happens in step 3's position and the half-of-B transfer happens in step 7's position, all other steps staying put. How many books would end up on Shelf A? Answer with a single number and nothing else."
      - "Suppose Ines had done step 7's operation (moving half of Shelf A's books to Shelf B) at the third position and step 3's operation (moving half of Shelf B's books to Shelf A) at the seventh position, with the rest of the sequence unchanged. How many books would Shelf A hold at the end? Answer with a single number and nothing else."
      - "In the edited sequence where the two half-transfers of step 3 and step 7 trade places and everything else is unchanged, what is the final number of books on Shelf A? Answer with a single number and nothing else."
      - "Had the step 3 and step 7 operations been exchanged in order, each half computed from the shelf's count at that moment and all other steps unchanged, how many books would sit on Shelf A at the end? Answer with a single number and nothing else."
    expected:
      type: exact
      value: "50"
    rationale: >
      Edited world with steps 3 and 7 swapped. 1. Step 1: A 40 - 6 = 34, B
      16 + 6 = 22. 2. Step 2: A 34 + 8 = 42. 3. Third position (move half of A
      to B): half of 42 is 21, so A 21, B 22 + 21 = 43. 4. Step 4: A 21 - 9 =
      12. 5. Step 5: A 12 - 4 = 8, B 43 + 4 = 47. 6. Step 6: B 47 + 5 = 52.
      7. Seventh position (move half of B to A): half of 52 is 26, so B 26, A
